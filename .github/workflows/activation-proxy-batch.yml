name: Skill routing proxy batched 25
on:
  workflow_dispatch:
    inputs:
      provider_model:
        description: LiteLLM model route, e.g. groq/llama-3.3-70b-versatile
        required: true
        default: groq/llama-3.3-70b-versatile
        type: string
  push:
    paths:
      - 'evals/activation/router_proxy_batches.py'
      - '.github/workflows/activation-proxy-batch.yml'
permissions:
  contents: read
jobs:
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ROUTER_TEST_BACKEND: litellm
      ROUTER_TEST_MODEL: ${{ inputs.provider_model || 'groq/llama-3.3-70b-versatile' }}
      ROUTER_TEST_API_KEY: ${{ secrets.GROQ_API_KEY }}
      ROUTER_TEST_BATCH_SIZE: '13'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install LiteLLM client
        run: python -m pip install 'litellm>=1.70,<2'
      - name: Run two large independent proxy batches
        run: python evals/activation/router_proxy_batches.py
