name: Skill routing proxy batched 25
on:
  workflow_dispatch:
    inputs:
      provider_model:
        description: OpenRouter model route through LiteLLM
        required: true
        default: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
        type: string
permissions:
  contents: read
jobs:
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ROUTER_TEST_BACKEND: litellm
      ROUTER_TEST_MODEL: ${{ inputs.provider_model || 'openrouter/nvidia/nemotron-3-ultra-550b-a55b:free' }}
      ROUTER_TEST_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ROUTER_TEST_BATCH_SIZE: '13'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install LiteLLM client
        run: python -m pip install 'litellm>=1.70,<2'
      - name: Run two large independent proxy batches
        run: python evals/activation/router_proxy_batches.py
